version: '3.8'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    environment:
      - DEBUG=1

  blender:
    build:
      context: ./blender_service

  slicer:
    build:
      context: ./slicer_service
    ports:
      - "8090:8090"

  mqtt_listener:
    volumes:
      - .:/app
