version: '3.8'

services:
  web:
    image: codemonstersoftware/modelfoundry:latest
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    ports:
      - "80:8000"
    expose:
      - "8000"
    environment:
      - DEBUG=0
      - SECRET_KEY=your-secret-key-here
      - DATABASE_URL=postgres://postgres:postgres@db:5432/modelfoundry
      - DOCKER_CONTAINER=true
      # Optional slicer sidecar (docker compose --profile slicer up); falls back to heuristic when down
      - SLICER_SERVICE_URL=http://slicer:8090
      # - "DEMO_BANNER_TEXT=Demo Credentials - User: admin / Pass: test"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "manage.py", "check", "--database", "default" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app_network

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=modelfoundry
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network
  blender:
    image: codemonstersoftware/modelfoundry-blender:latest
    volumes:
      - media_volume:/app/media
      - ./media/scripts:/app/media/scripts
    ports:
      - "8081:8081"
    networks:
      - app_network
      
  slicer:
    image: codemonstersoftware/modelfoundry-slicer:latest
    profiles: ["slicer"]
    restart: unless-stopped
    # no host port: web reaches it over app_network (dev override publishes 8090)
    networks:
      - app_network

  mqtt_listener:
    image: codemonstersoftware/modelfoundry:latest
    command: python manage.py run_mqtt_listener
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - logs_volume:/app/logs
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/modelfoundry
      - PYTHONUNBUFFERED=1
      - DOCKER_CONTAINER=true
      - SECRET_KEY=your-secret-key-here
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  static_volume:
  media_volume:
  logs_volume:
  postgres_data:
